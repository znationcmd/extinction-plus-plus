name: EXTINCTION RSS - live Discord selector smoke test
on:
  push:
    paths: [".github/workflows/rss-discord-selector-live-smoke.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify RSS Dashboard cold start and protected Discord directory
        shell: bash
        run: |
          set -euo pipefail
          base="https://dashboard-production-e07b.up.railway.app"
          ok=0
          for attempt in $(seq 1 8); do
            status=$(curl -sS -L --max-time 30 --connect-timeout 10 -o /tmp/rss-home -w '%{http_code}' "$base/" || true)
            echo "Dashboard request $attempt: $status"
            if [ "$status" = "200" ]; then ok=1; break; fi
            sleep 6
          done
          test "$ok" = 1
          status=$(curl -sS --max-time 30 --connect-timeout 10 -o /tmp/rss-roles -w '%{http_code}' "$base/api/discord-resources")
          echo "Unauthenticated roles endpoint: HTTP $status"
          test "$status" = "401" || { cat /tmp/rss-roles | head -c 300; exit 1; }
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/rss-roles'))
          assert 'error' in data, data
          print('No unauthenticated Discord guild access.')
          PY
          status=$(curl -sS --max-time 30 --connect-timeout 10 -o /tmp/rss-modules -w '%{http_code}' "$base/discord-module/welcome")
          echo "Welcome module page (unauthenticated): HTTP $status"
          test "$status" = "307" -o "$status" = "308" -o "$status" = "302" || exit 1
