name: CMD incremental bot source inventory (read-only)
on:
  pull_request:
    paths:
      - 'tools/cmd-update-plan.mjs'
      - 'tests/cmd-update-plan.test.mjs'
      - '.github/workflows/cmd-update-inventory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tools/cmd-update-plan.mjs
      - run: node --test tests/cmd-update-plan.test.mjs
      - run: node tools/cmd-update-plan.mjs --scope 'index.js,server.js,config.js,deploy-commands.js,theme-helper.js,package.json,package-lock.json,dashboard/,shared/,scripts/,config/' --output cmd-update-inventory.json
      - uses: actions/upload-artifact@v4
        with:
          name: cmd-update-inventory
          path: cmd-update-inventory.json
          if-no-files-found: error
