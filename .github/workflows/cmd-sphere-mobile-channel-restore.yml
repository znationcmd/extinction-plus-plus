name: CMD Sphere - iPhone salon full screen regression
on:
  workflow_dispatch:
  push:
    branches:
      - cmd-sphere/boutique-4k-refonte-20261016
    paths:
      - cmd-discord-mcp/cmd-chat-polish.js
      - cmd-discord-mcp/cmd-personal-backgrounds.js
      - cmd-discord-mcp/cmd-app-update.js
      - cmd-discord-mcp/server.js
      - cmd-discord-mcp/tests/unified-wallpaper.test.cjs
      - cmd-discord-mcp/discord-native-layout.css
      - cmd-discord-mcp/tests/mobile-channel-fullscreen.test.cjs
      - .github/workflows/cmd-sphere-mobile-channel-restore.yml
permissions:
  contents: read
jobs:
  channel-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cmd-discord-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify syntax
        run: node --check cmd-chat-polish.js && node --check cmd-personal-backgrounds.js && node --check cmd-app-update.js && node --check server.js
      - name: Install test dependencies only
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test original full screen behavior and back navigation
        run: node --test tests/mobile-channel-fullscreen.test.cjs tests/unified-wallpaper.test.cjs
