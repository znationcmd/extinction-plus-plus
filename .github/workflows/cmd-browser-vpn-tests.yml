name: CMD Browser VPN simulations
on:
  push:
    branches: [cmd-browser-railway-source-20261013]
    paths:
      - 'cmd-browser-desktop/**'
      - '.github/workflows/cmd-browser-vpn-tests.yml'
  workflow_dispatch:
jobs:
  vpn-simulations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Simulate VPN states
        run: node cmd-browser-desktop/vpn.simulation.test.cjs && node cmd-browser-desktop/vpn-browser.integration.test.cjs
      - name: Check desktop syntax
        run: node --check cmd-browser-desktop/main.cjs && node --check cmd-browser-desktop/preload.cjs
