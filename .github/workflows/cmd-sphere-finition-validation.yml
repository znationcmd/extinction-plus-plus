  validate-locale-auto:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cmd-discord-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse mobile language settings and runtime integration
        run: |
          node --check cmd-language-auto.js
          node --check settings-ui.js
          node --check patch-runtime.cjs
          node --check server.js
      - name: Verify locale detection, manual override and worldwide pagination
        run: node --test tests/language-auto-ui.test.cjs tests/world-languages.test.cjs

  validate-country-language-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cmd-discord-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse country navigation, runtime routes and frontend
        run: |
          node --check settings-ui.js
          node --check server.js
          node --check cmd-language-auto.js
      - name: Verify A to Z language folders, optional countries, Swiss dialects and 8148-language fallback
        run: node --test tests/country-language-navigation.test.cjs tests/language-alphabet-navigation.test.cjs tests/language-auto-ui.test.cjs tests/world-languages.test.cjs
