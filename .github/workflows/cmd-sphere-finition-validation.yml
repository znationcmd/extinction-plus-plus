  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cmd-sphere-finition-profiles
  cancel-in-progress: true
jobs:
  validate-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: cmd-discord-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cmd-discord-mcp/package-lock.json
      - name: Verify JavaScript syntax
        run: |
          node --check cmd-profile-scene-api.js
          node --check cmd-profile-scene.js
      - name: Install exact dependencies and restore bundled assets
        run: npm ci
      - name: Test account isolation, decoration saves, legacy avatars and 3D compatibility
        run: node --test tests/profile-scene-preservation.test.cjs tests/profile-scene-controls.test.cjs tests/profile-3d.test.cjs tests/profile-scene-ui-save.test.cjs

  validate-all:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cmd-discord-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cmd-discord-mcp/package-lock.json
      - name: Install dependencies and source assets
        run: npm ci
      - name: Run entire CMD Sphere automated test suite
        run: npm test

  validate-slowmode:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cmd-discord-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check application and slowmode JavaScript syntax
        run: |
          node --check server.js
          node --check cmd-server-manager.js
          node --check cmd-native-slowmode.js
      - name: Test 59-contract channel slowmode implementation
        run: node --test tests/native-slowmode.test.cjs

  validate-templates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cmd-discord-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test isolated and authorized server template creation
        run: node --test tests/native-templates-contract.test.cjs

  validate-privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cmd-discord-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and safety
        run: |
          node --check cmd-social-privacy.js
          node --check cmd-social-privacy-ui.js
          node --check cmd-dm-guild-privacy.js
          node --check server.js
      - name: Install browser test fixtures
        run: npm ci
      - name: Verify real account privacy behavior and buttons
        run: node --test tests/social-privacy.test.cjs tests/social-privacy-ui.test.cjs tests/dm-guild-privacy.test.cjs

  validate-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: cmd-discord-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test fixtures
        run: npm ci
      - name: Validate opt-in message reminders and cancellation
        run: |
          node --check cmd-message-reminders.js
          node --check cmd-message-reminders-ui.js
          node --test tests/message-reminders-ui.test.cjs

  validate-voice-volume:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: cmd-discord-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse voice and participant controls
        run: |
          node --check call-ui.js
          node --check tests/voice-peer-volume.test.cjs
      - name: Test real per-member volume and unsupported mobile behavior
        run: node --test tests/voice-peer-volume.test.cjs

  validate-server-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    defaults:
      run:
        working-directory: cmd-discord-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check verification engine and updated native forms
        run: |
          node --check cmd-server-verification.js
          node --check cmd-native-invites.js
          node --check cmd-server-manager.js
          node --check server.js
      - name: Test safe member verification
        run: node --test tests/server-verification.test.cjs

  validate-media-channels:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: cmd-discord-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check media validation syntax
        run: |
          node --check server.js
          node --check cmd-server-manager.js
          node --check cmd-native-media-channels.js
      - name: Test original data preservation and media-only messages
        run: node --test tests/native-media-channels.test.cjs

  validate-forum-threads:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: cmd-discord-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check forum lifecycle server and UI JavaScript
        run: |
          node --check server.js
          node --check cmd-forum-thread-controls.js
          node --check cmd-social-message-actions.js
      - name: Test forum lifecycle without touching a production database
        run: node --test tests/native-forum-thread-controls.test.cjs tests/native-forum-tags.test.cjs

  validate-history-attachments:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cmd-discord-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check search engine and browser source syntax
        run: |
          node --check cmd-message-history-search.js
          node --check cmd-chat-history-ui.js
      - name: Test searchable message history, attachments and privacy boundaries
        run: |
          npm ci
          node --test tests/history-attachment-filter.test.cjs tests/history-attachment-ui.test.cjs tests/cmd-history-search.test.cjs tests/cmd-message-history-search.test.cjs tests/cmd-parity-24.test.cjs
  
  validate-community-insights:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cmd-discord-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify aggregate API and dashboard syntax
        run: |
          node --check cmd-community-insights.js
          node --check cmd-server-manager.js
          node --check server.js
      - name: Verify privacy, owner access and community statistics
        run: node --test tests/native-community-insights.test.cjs tests/cmd-parity-24.test.cjs

  validate-community-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cmd-discord-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify native opt-in directory JavaScript syntax
        run: |
          node --check cmd-community-discovery.js
          node --check cmd-server-manager.js
          node --check server.js
      - name: Test safe opt-in public directory, permissions and privacy
        run: node --test tests/native-community-discovery.test.cjs tests/cmd-parity-24.test.cjs

  validate-native-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cmd-discord-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify audit chain, native server routes and mobile settings
        run: |
          node --check cmd-native-audit-log.js
          node --check cmd-server-manager.js
          node --check server.js
      - name: Test authorization, hash chaining, read-only history and UI
        run: node --test tests/native-audit-log.test.cjs

  validate-native-automod:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cmd-discord-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse opt-in moderation server and settings
        run: |
          node --check cmd-native-automod.js
          node --check cmd-server-manager.js
          node --check server.js
      - name: Test owner-only AutoMod and preserve existing parity safety
        run: node --test tests/native-automod.test.cjs tests/cmd-parity-24.test.cjs

  validate-account-export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cmd-discord-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check secure personal data export and settings JavaScript
        run: |
          node --check cmd-account-export.js
          node --check settings-ui.js
          node --check server.js
      - name: Test authenticated bounded download and sensitive-data redaction
        run: node --test tests/account-export.test.cjs tests/cmd-parity-59.test.cjs

  validate-native-voice-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cmd-discord-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check voice channel configuration JavaScript
        run: |
          node --check cmd-native-voice-config.js
          node --check cmd-server-manager.js
          node --check server.js
      - name: Verify owner-managed voice channel limits without claiming WebRTC enforcement
        run: node --test tests/native-voice-config.test.cjs tests/cmd-parity-59.test.cjs

  validate-native-afk-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cmd-discord-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse AFK native server metadata
        run: |
          node --check cmd-native-afk-config.js
          node --check cmd-server-manager.js
          node --check server.js
      - name: Validate owner-restricted AFK configuration without moving voice peers
        run: node --test tests/native-afk-config.test.cjs tests/cmd-parity-59.test.cjs

  validate-native-onboarding:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cmd-discord-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
