name: CMD Sphere - non-destructive profile validation
on:
  push:
    branches:
      - cmd-sphere/finition-20261018
    paths:
      - 'cmd-discord-mcp/cmd-profile-scene-api.js'
      - 'cmd-discord-mcp/cmd-profile-scene.js'
      - 'cmd-discord-mcp/tests/profile-scene-*.test.cjs'
      - 'cmd-discord-mcp/tests/profile-3d.test.cjs'
      - 'cmd-discord-mcp/cmd-profile-premium.css'
      - 'cmd-discord-mcp/cmd-premium-art.js'
      - 'cmd-discord-mcp/tests/message-profile-menus.test.cjs'
      - 'cmd-discord-mcp/tests/interactions.test.cjs'
      - 'cmd-discord-mcp/tests/profile-video-studio.test.cjs'
      - 'cmd-discord-mcp/cmd-promo-studio.js'
      - 'cmd-discord-mcp/tests/studio-music-iphone.test.cjs'
      - 'cmd-discord-mcp/tests/server-icon-hosting.test.cjs'
      - 'cmd-discord-mcp/cmd-native-slowmode.js'
      - 'cmd-discord-mcp/tests/native-slowmode.test.cjs'
      - 'cmd-discord-mcp/cmd-message-forward-ui.js'
      - 'cmd-discord-mcp/tests/native-message-forward.test.cjs'
      - 'cmd-discord-mcp/cmd-sensitive-media.js'
      - 'cmd-discord-mcp/cmd-sensitive-media-ui.js'
      - 'cmd-discord-mcp/tests/sensitive-media.test.cjs'
      - 'cmd-discord-mcp/cmd-social-message-actions.js'
      - 'cmd-discord-mcp/cmd-social-privacy.js'
      - 'cmd-discord-mcp/cmd-social-privacy-ui.js'
      - 'cmd-discord-mcp/tests/social-privacy.test.cjs'
      - 'cmd-discord-mcp/tests/social-privacy-ui.test.cjs'
      - 'cmd-discord-mcp/cmd-dm-guild-privacy.js'
      - 'cmd-discord-mcp/tests/dm-guild-privacy.test.cjs'
      - 'cmd-discord-mcp/cmd-streamer-mode.js'
      - 'cmd-discord-mcp/cmd-streamer-mode-ui.js'
      - 'cmd-discord-mcp/tests/streamer-mode.test.cjs'
      - 'cmd-discord-mcp/tests/native-templates-contract.test.cjs'
      - 'cmd-discord-mcp/cmd-parity-expansion-servers.js'
      - 'cmd-discord-mcp/cmd-social-message-actions.js'
      - 'cmd-discord-mcp/cmd-parity-extra-productivity.js'
      - 'cmd-discord-mcp/cmd-message-reminders.js'
      - 'cmd-discord-mcp/cmd-message-reminders-ui.js'
      - 'cmd-discord-mcp/tests/message-reminders-*.test.cjs'
      - 'cmd-discord-mcp/tests/message-tts.test.cjs'
      - 'cmd-discord-mcp/tests/cmd-parity-59.test.cjs'
      - 'cmd-discord-mcp/cmd-server-manager.js'
      - 'cmd-discord-mcp/cmd-forum-tags.js'
      - 'cmd-discord-mcp/cmd-server-verification.js'
      - 'cmd-discord-mcp/cmd-native-invites.js'
      - 'cmd-discord-mcp/tests/server-verification.test.cjs'
      - 'cmd-discord-mcp/tests/native-forum-tags.test.cjs'
      - 'cmd-discord-mcp/server.js'
      - 'cmd-discord-mcp/call-ui.js'
      - 'cmd-discord-mcp/tests/voice-peer-volume.test.cjs'
      - '.github/workflows/cmd-sphere-finition-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cmd-sphere-finition-profiles
  cancel-in-progress: true
jobs:
  validate-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: cmd-discord-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cmd-discord-mcp/package-lock.json
      - name: Verify JavaScript syntax
        run: |
          node --check cmd-profile-scene-api.js
          node --check cmd-profile-scene.js
      - name: Install exact dependencies and restore bundled assets
        run: npm ci
      - name: Test account isolation, decoration saves, legacy avatars and 3D compatibility
        run: node --test tests/profile-scene-preservation.test.cjs tests/profile-scene-controls.test.cjs tests/profile-3d.test.cjs tests/profile-scene-ui-save.test.cjs

  validate-all:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cmd-discord-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cmd-discord-mcp/package-lock.json
      - name: Install dependencies and source assets
        run: npm ci
      - name: Run entire CMD Sphere automated test suite
        run: npm test

  validate-slowmode:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cmd-discord-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check application and slowmode JavaScript syntax
        run: |
          node --check server.js
          node --check cmd-server-manager.js
          node --check cmd-native-slowmode.js
      - name: Test 59-contract channel slowmode implementation
        run: node --test tests/native-slowmode.test.cjs

  validate-templates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cmd-discord-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test isolated and authorized server template creation
        run: node --test tests/native-templates-contract.test.cjs

  validate-privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cmd-discord-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and safety
        run: |
          node --check cmd-social-privacy.js
          node --check cmd-social-privacy-ui.js
          node --check cmd-dm-guild-privacy.js
          node --check server.js
      - name: Install browser test fixtures
        run: npm ci
      - name: Verify real account privacy behavior and buttons
        run: node --test tests/social-privacy.test.cjs tests/social-privacy-ui.test.cjs tests/dm-guild-privacy.test.cjs

  validate-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: cmd-discord-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test fixtures
        run: npm ci
      - name: Validate opt-in message reminders and cancellation
        run: |
          node --check cmd-message-reminders.js
          node --check cmd-message-reminders-ui.js
          node --test tests/message-reminders-ui.test.cjs

  validate-voice-volume:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: cmd-discord-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse voice and participant controls
        run: |
          node --check call-ui.js
          node --check tests/voice-peer-volume.test.cjs
      - name: Test real per-member volume and unsupported mobile behavior
        run: node --test tests/voice-peer-volume.test.cjs

  validate-server-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    defaults:
      run:
        working-directory: cmd-discord-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check verification engine and updated native forms
        run: |
          node --check cmd-server-verification.js
          node --check cmd-native-invites.js
          node --check cmd-server-manager.js
          node --check server.js
      - name: Test safe member verification
        run: node --test tests/server-verification.test.cjs
