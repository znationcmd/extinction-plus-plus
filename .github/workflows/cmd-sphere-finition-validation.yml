      - name: Check native rules enforcement syntax and server integration
        run: |
          node --check cmd-native-rules-screening.js
          node --check server.js
          node --check cmd-server-manager.js
      - name: Test explicit member acceptance and privileged owner control
        run: node --test tests/native-rules-screening.test.cjs

  validate-world-languages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cmd-discord-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse worldwide catalogue localization and translation
        run: |
          node --check cmd-world-language-codes.js
          node --check cmd-translation.js
          node --check cmd-message-translate.js
          node --check settings-ui.js
          node --check server.js
      - name: Validate worldwide languages and Swiss German dialect support
        run: node --test tests/world-languages.test.cjs

  validate-native-raid:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cmd-discord-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check opt-in anti-raid native server and invite guards
        run: |
          node --check cmd-native-raid-protection.js
          node --check cmd-native-invites.js
          node --check server.js
          node --check cmd-server-manager.js
      - name: Verify guarded invite flows, owner auth and existing invite regressions
