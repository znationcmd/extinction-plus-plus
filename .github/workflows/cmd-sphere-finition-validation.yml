  validate-native-voice-text:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cmd-discord-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate native voice-room text JavaScript
        run: |
          node --check server.js
          node --check cmd-parity-extra-media.js
      - name: Ensure voice-room messages preserve permissions and messaging safety
        run: node --test tests/native-voice-text.test.cjs tests/cmd-parity-59.test.cjs

