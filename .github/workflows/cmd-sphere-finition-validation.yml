      - name: Verify native role onboarding server and browser syntax
        run: |
          node --check cmd-native-onboarding.js
          node --check server.js
          node --check cmd-server-manager.js
      - name: Test private onboarding, owner authorization and no role escalation
        run: node --test tests/native-onboarding.test.cjs

  validate-native-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cmd-discord-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
