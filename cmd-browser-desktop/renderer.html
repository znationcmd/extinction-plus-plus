<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CMD Browser — PC</title><style>body{font:15px system-ui;background:#100b26;color:#fff;margin:0}header{display:flex;gap:8px;padding:10px;background:#241741}button,input{border:1px solid #7059a4;border-radius:9px;padding:10px;background:#342354;color:#fff}input{flex:1}main{padding:28px;max-width:850px;margin:auto}a{color:#cbb7ff}</style></head><body><header><button id="back">←</button><button id="forward">→</button><button id="home">⌂</button><input id="url" aria-label="Adresse ou recherche" placeholder="Adresse Web"><button id="go">Ouvrir</button></header><main><h1>CMD Browser — PC</h1><p>Version de démarrage pour Windows, macOS et Linux.</p><p>Les sites s'ouvrent dans le navigateur système tant que les onglets natifs ne sont pas développés.</p><p><a id="cmd" href="#">Ouvrir CMD Browser Web</a></p></main><script>const input=document.querySelector('#url');const open=()=>{let q=input.value.trim();if(!q)return;let url;try{url=new URL(/^https?:\/\//i.test(q)?q:'https://'+q);if(!['http:','https:'].includes(url.protocol))return}catch{return}window.open(url.href,'_blank')};document.querySelector('#go').onclick=open;input.onkeydown=e=>{if(e.key==='Enter')open()};document.querySelector('#home').onclick=async()=>window.open(await window.cmdDesktop.home(),'_blank');document.querySelector('#cmd').onclick=async e=>{e.preventDefault();window.open(await window.cmdDesktop.home(),'_blank')};document.querySelector('#back').disabled=true;document.querySelector('#forward').disabled=true;</script></body></html>
