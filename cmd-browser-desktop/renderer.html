<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CMD Browser</title><style>*{box-sizing:border-box}body{margin:0;background:#140d2b;color:white;font:14px system-ui}#tabs{height:48px;display:flex;align-items:center;gap:5px;padding:5px 10px;overflow-x:auto;background:#1c1237}.tab{display:flex;align-items:center;gap:6px;background:#32234e;border-radius:9px;padding:3px 6px;max-width:210px;white-space:nowrap}.tab.active{background:#67418c}.tab button{max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}button,input{border:0;color:#fff;background:transparent;font:inherit;padding:8px;cursor:pointer}button:hover{background:#ffffff24;border-radius:7px}#nav{height:56px;display:flex;gap:7px;align-items:center;padding:8px 12px;background:#241741}input{background:#fff;color:#191324;border-radius:24px;flex:1;padding:11px 18px;outline:none}#add{font-size:20px}#panel{position:absolute;right:12px;top:104px;z-index:10;width:min(420px,90vw);max-height:70vh;overflow:auto;background:#261b44;border:1px solid #7857aa;border-radius:12px;padding:12px;box-shadow:0 10px 35px #0008}#panel[hidden]{display:none}#panel button{display:block;text-align:left;width:100%;overflow-wrap:anywhere}#panel button:hover{background:#5c4085}</style></head><body><div id="tabs"></div><div id="nav"><button id="back" title="Précédent">←</button><button id="forward" title="Suivant">→</button><button id="reload" title="Actualiser">⟳</button><button id="home" title="Accueil">⌂</button><input id="url" aria-label="Adresse ou recherche" placeholder="Rechercher ou saisir une adresse"><button id="go">Ouvrir</button><button id="bookmark" title="Ajouter aux favoris">☆</button><button id="showBookmarks" title="Favoris">Favoris</button><button id="showHistory" title="Historique">Historique</button></div><div id="panel" hidden></div><script>let state={active:-1,tabs:[]};const $=id=>document.getElementById(id),act=(a,v)=>window.cmdDesktop.action(a,v);function render(){const list=$('tabs');list.replaceChildren();state.tabs.forEach((t,i)=>{const box=document.createElement('span');box.className='tab'+(i===state.active?' active':'');const b=document.createElement('button');b.textContent=t.title||t.url||'Nouvel onglet';b.title=t.url;b.onclick=()=>act('select',t.id);const x=document.createElement('button');x.textContent='×';x.title='Fermer';x.onclick=()=>act('close',t.id);box.append(b,x);list.append(box)});const add=document.createElement('button');add.id='add';add.textContent='+';add.title='Nouvel onglet';add.onclick=()=>act('new');list.append(add);const t=state.tabs[state.active];if(t){$('bookmark').textContent=t.bookmarked?'★':'☆';$('url').value=t.url||'';$('back').disabled=!t.back;$('forward').disabled=!t.forward}}window.cmdDesktop.onState(s=>{state=s;render()});$('go').onclick=()=>act('go',$('url').value);$('url').onkeydown=e=>{if(e.key==='Enter')act('go',$('url').value)};['back','forward','reload','home'].forEach(a=>$(a).onclick=()=>act(a));$('bookmark').onclick=()=>act('bookmark');async function show(kind){const panel=$('panel');if(!panel.hidden&&panel.dataset.kind===kind){panel.hidden=true;return}panel.dataset.kind=kind;panel.hidden=false;panel.replaceChildren();const close=document.createElement('button');close.textContent='✕ Fermer';close.onclick=()=>panel.hidden=true;panel.append(close);const items=await act(kind);if(!items?.length){panel.append('Aucun élément enregistré');return}for(const entry of items){const url=typeof entry==='string'?entry:entry.url;const b=document.createElement('button');b.textContent=typeof entry==='string'?entry:(entry.title||url);b.title=url;b.onclick=()=>{act('go',url);panel.hidden=true};panel.append(b)}}$('showBookmarks').onclick=()=>show('bookmarks');$('showHistory').onclick=()=>show('history');</script></body></html>
